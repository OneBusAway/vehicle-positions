name: VehicleTracker

options:
  bundleIdPrefix: org.onebusaway
  minimumXcodeGenVersion: 2.45.4
  defaultSourceDirectoryType: syncedFolder
  generateEmptyDirectories: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "26.4"

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEFAULT_SERVER_URL: ""

packages:
  VehiclePositionsKit:
    path: ../VehiclePositionsKit

targets:
  VehicleTracker:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Engine
      - path: Model
      - path: UI
      - path: Map
      - path: CarPlay
      - path: Resources
      - path: Shared
      - path: LiveActivity
    dependencies:
      - package: VehiclePositionsKit
      - target: VehicleTrackerWidgets
    preBuildScripts:
      - name: Check DEFAULT_SERVER_URL
        basedOnDependencyAnalysis: false
        script: |
          case "$DEFAULT_SERVER_URL" in
            "" | https://*) ;;
            *) echo "error: DEFAULT_SERVER_URL must be an https:// address, or empty for no default (got \"$DEFAULT_SERVER_URL\")"; exit 1 ;;
          esac
    # Team, bundle id, display name and CarPlay come from here, so an agency can
    # set them without editing this file (docs/deployment.md §14). The
    # entitlements file is chosen there too: it carries only the CarPlay one.
    configFiles:
      Debug: Config/Agency.xcconfig
      Release: Config/Agency.xcconfig
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [obavehicletracker]
        OBADefaultServerURL: $(DEFAULT_SERVER_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Your position is reported to the transit agency's server while a trip is running, so riders can see where the vehicle is.
        NSLocationTemporaryUsageDescriptionDictionary:
          TripReporting: Precise location puts the vehicle on the right street on riders' maps.
        UIBackgroundModes: [location]
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

  VehicleTrackerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Resources/Assets.xcassets
    info:
      path: WidgetsInfo.plist
      properties:
        CFBundleDisplayName: OBA Vehicle Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.onebusaway.vehicletracker.widgets
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

  VehicleTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: VehicleTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VehicleTracker:
    build:
      targets:
        VehicleTracker: all
        VehicleTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [VehicleTrackerTests]
