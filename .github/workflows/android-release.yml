name: Android release

# Publishes a signed APK as a GitHub Release when a tag like `android-v1.2.0` is pushed.
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file (`base64 -i vehicle-tracker-release.jks`)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Optional: a repository variable DEFAULT_SERVER_URL builds that https:// address into the app as
# the server Sign in starts from (docs/deployment.md §13.2).
# See docs/deployment.md §12.4.
on:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
            - name: Restore the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not set; see docs/deployment.md §12.4" >&2; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEFAULT_SERVER_URL: ${{ vars.DEFAULT_SERVER_URL }}
        # Derive versionCode from semantic versioning (major*10000 + minor*100 + patch) so it
        # strictly increases with version bumps and stays above CI run numbers.
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#android-v}"
          IFS='.' read -r major minor patch <<< "$VERSION_NAME"
          patch="${patch%%-*}"
          if [ "$minor" -ge 100 ] || [ "$patch" -ge 100 ]; then
            echo "minor and patch must each be under 100 for versionCode encoding" >&2
            exit 1
          fi
          VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))
          ./gradlew :app:assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            -PdefaultServerUrl="$DEFAULT_SERVER_URL"
      - name: Verify the signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "vehicle-tracker-${GITHUB_REF_NAME#android-v}.apk"
          gh release create "$GITHUB_REF_NAME" "vehicle-tracker-${GITHUB_REF_NAME#android-v}.apk" \
            --title "Android $GITHUB_REF_NAME" --generate-notes
