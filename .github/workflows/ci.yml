name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # Matches the db service in docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vehicle_positions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/vehicle_positions?sslmode=disable
        run: go test ./...

      - name: Build Docker image
        run: docker build -t vehicle-positions:ci .

      - name: Verify committed Tailwind CSS is current
        if: runner.os == 'Linux'
        run: |
          # Pinned to the same tailwindcss release (and SHA-256 from its
          # sha256sums.txt) as Makefile's TAILWIND_VERSION — bump together.
          curl -fsSL https://github.com/tailwindlabs/tailwindcss/releases/download/v4.2.0/tailwindcss-linux-x64 -o /tmp/tailwindcss
          echo "8f65e2d21c675f1e8d265219979d17d10634c1f553a2f583265b7edb28726432  /tmp/tailwindcss" | sha256sum -c -
          chmod +x /tmp/tailwindcss
          /tmp/tailwindcss -i web/styles/input.css -o /tmp/admin.css --minify
          diff -q /tmp/admin.css web/static/css/admin.css || { echo "web/static/css/admin.css is stale — run 'make css' and commit"; exit 1; }
