services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vehicle_positions
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/vehicle_positions?sslmode=disable"
      STALENESS_THRESHOLD: "5m"
      # Required, from the environment or a .env file next to this file
      # (e.g. `JWT_SECRET=$(openssl rand -hex 32)`). Compose only refuses an
      # unset or empty value — enough that no checked-in placeholder can reach
      # a real host; the 32-byte minimum is enforced by the server at startup.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set; the server requires 32+ bytes}"
      # Also required, the same way: drivers pick their route and run from this
      # schedule. The image carries no GTFS file, so give an http(s):// URL the
      # container can download — a path on your machine is not inside it.
      GTFS_STATIC_URL: "${GTFS_STATIC_URL:?GTFS_STATIC_URL must be set; the server needs a GTFS static zip URL}"
      # Rider mode is off by default. Set this to "true" to turn it on; riders
      # are verified against the schedule above.
      RIDER_MODE_ENABLED: "false"
      # Admin bootstrap credentials (admin@test.com/password). The server creates
      # an admin account only on first boot (when none exist yet), so these can be
      # left set across restarts. The simulator, make smoke, and the admin UI all
      # use these credentials by default. Compose refuses to start without them.
      ADMIN_BOOTSTRAP_EMAIL: "${ADMIN_BOOTSTRAP_EMAIL:?ADMIN_BOOTSTRAP_EMAIL must be set}"
      ADMIN_BOOTSTRAP_PASSWORD: "${ADMIN_BOOTSTRAP_PASSWORD:?ADMIN_BOOTSTRAP_PASSWORD must be set}"
      # TRUSTED_GTFS_RT_URLS: "https://example.org/vehicle-positions.pb"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
