services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vehicle_positions
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/vehicle_positions?sslmode=disable"
      STALENESS_THRESHOLD: "5m"
      # Required, 32+ bytes, from the environment or a .env file next to this
      # file (e.g. `JWT_SECRET=$(openssl rand -hex 32)`). Compose refuses to
      # start without it, so no checked-in placeholder can reach a real host.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set to a 32+ byte secret}"
      # Rider mode is off by default. To turn it on, set this to "true" and
      # point GTFS_STATIC_URL at a GTFS static zip (URL or path); the server
      # exits at startup if it is enabled without one.
      RIDER_MODE_ENABLED: "false"
      # GTFS_STATIC_URL: "https://example.org/gtfs.zip"
      # TRUSTED_GTFS_RT_URLS: "https://example.org/vehicle-positions.pb"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
