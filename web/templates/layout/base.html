<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{.Title}} — Transit Tracker</title>

<link rel="stylesheet" href="/static/css/admin.css">
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css"/>
</head>

<body>

<div class="flex min-h-screen flex-col gap-4 p-3 lg:flex-row lg:items-start lg:p-5">
{{template "sidebar" .}}

<main class="page-shell flex min-w-0 flex-1 flex-col rounded-[30px] border border-white/60">

{{template "header" .}}

{{if .Flash}}<div class="glass-panel mx-5 mt-4 rounded-xl border border-emerald-200 bg-emerald-50/80 px-4 py-3 text-sm font-semibold text-emerald-800" role="status">{{.Flash}}</div>{{end}}

<div class="flex-1">

{{template "content" .}}

</div>

</main>
</div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
