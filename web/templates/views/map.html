{{define "content"}}
<div class="p-4 lg:p-5">
  <div class="grid gap-4 lg:grid-cols-[1fr_280px]">

    <!-- Map -->
    <div class="relative overflow-hidden rounded-[24px] border border-white/70 shadow-xl" style="height:calc(100vh - 9rem); min-height:480px">
      <div id="main-map" class="absolute inset-0"
           data-live-url="/api/v1/admin/vehicles/live"
           {{if .TripID}}data-trip-url="/api/v1/admin/trips/{{.TripID}}/locations"{{end}}></div>

      <!-- Empty-state banner, shown by JS when there's no data to display -->
      <div id="empty-banner" class="hidden pointer-events-none absolute inset-x-0 top-4 z-[500] flex justify-center">
        <div class="glass-panel pointer-events-auto rounded-xl border border-white/70 px-4 py-2.5 text-xs font-semibold text-slate-600 shadow-md">
          No vehicles to show right now.
        </div>
      </div>

      <!-- Stats overlay top-left -->
      <div class="pointer-events-none absolute left-4 top-4 z-[500]">
        <div class="glass-panel pointer-events-auto inline-flex items-center gap-5 rounded-2xl border border-white/70 px-5 py-3 shadow-lg">
          <div class="text-center">
            <p id="stat-active" class="display-font text-2xl font-bold text-slate-900">0</p>
            <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-emerald-700">Active</p>
          </div>
          <div class="h-7 w-px bg-slate-200"></div>
          <div class="text-center">
            <p id="stat-routes" class="display-font text-2xl font-bold text-slate-900">0</p>
            <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-500">Routes</p>
          </div>
        </div>
      </div>

      <!-- Legend bottom-left -->
      <div class="pointer-events-none absolute bottom-4 left-4 z-[500]">
        <div class="glass-panel pointer-events-auto inline-flex items-center gap-4 rounded-xl border border-white/70 px-4 py-2.5 text-xs font-medium text-slate-700 shadow-md">
          <span class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-full bg-teal-600"></span>Active</span>
        </div>
      </div>
    </div>

    <!-- Fleet sidebar -->
    <div class="space-y-4">
      <div class="table-card rounded-[20px] border border-white/80 p-4">
        <div class="mb-3 flex items-center justify-between">
          <h3 id="fleet-title" class="display-font text-sm font-bold text-slate-900">Fleet Status</h3>
        </div>
        <div id="fleet-list" class="space-y-2"></div>
      </div>
    </div>

  </div>
</div>
{{end}}
