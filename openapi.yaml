openapi: 3.1.0
info:
  title: Vehicle Positions API
  version: 0.1.0
  summary: Realtime vehicle position tracking for transit agencies without AVL hardware.
  description: |
    The Vehicle Positions server ingests GPS reports from driver Android apps
    and serves a standards-compliant GTFS-RT Vehicle Positions feed. It is
    built for transit agencies in developing countries that have a GTFS static
    feed and a fleet of Android phones but no AVL infrastructure.

    This document describes every JSON API endpoint the server registers.
    Schemas, validation rules, and status codes are derived directly from the
    handler source.

    `openapi_test.go` parses the server's Go source and holds this file to
    it: routes must match the mux registrations in both directions, every
    route behind `requireAuth` / `requireAdmin` must declare the matching
    `401` / `403`, and the validation keywords that mirror a Go constant
    must equal it. What none of that reaches is prose — descriptions still
    have to be read against the handlers by hand.

    Out of scope: the server-rendered admin UI (`/admin/*`, `/static/*`),
    which serves HTML pages and form posts rather than JSON and is disabled
    by setting `ADMIN_UI_ENABLED` to a false value (it is on by default).
    Those routes are listed explicitly in `openapi_test.go` so that adding
    one is a deliberate decision rather than an invisible gap.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: auth
    description: Driver authentication.
  - name: locations
    description: GPS location ingest.
  - name: feed
    description: GTFS-RT feed consumption.
  - name: health
    description: Liveness and readiness probes.
  - name: admin
    description: |
      Administrative management endpoints. A read takes an `admin` or a
      `viewer` token; anything that changes something takes an `admin` token,
      and a viewer gets `403` with `admin access required`. A viewer is
      refused on the driver-facing routes too, which take a driver or admin
      token.
  - name: trips
    description: Driver trip lifecycle.
  - name: vehicles
    description: Driver-facing vehicle access.
  - name: gtfs
    description: Read-only access to the loaded GTFS schedule.
  - name: map
    description: Where the driver app gets its offline street map.
  - name: rider
    description: |
      Crowd-sourced positioning from rider devices. These five routes are
      registered only when rider mode is configured; a server without it
      answers 404 for all of them. `GET /api/v1/admin/rider/status` reports
      which it is, and is always present.

# All endpoints require a bearer JWT unless they explicitly opt out with `security: []`.
security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      description: |
        Exchanges an email and password for an access token plus a refresh
        token. The access token must be supplied as
        `Authorization: Bearer <access_token>` on protected endpoints; its
        lifetime is set by `ACCESS_TOKEN_TTL` and is reported as
        `expires_in`. Renew it with `POST /api/v1/auth/refresh` rather than
        re-sending credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Too many login attempts. The limiter keys on client IP and the
            submitted email; a successful login clears the email's counter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new access token
      description: |
        Returns a new access token and a new refresh token. Deliberately
        unauthenticated: the access token is expired by definition when a
        client needs this, so the refresh token is the credential.

        Refresh tokens are single-use. Each call consumes the token presented
        and returns its replacement, so a client must store the new
        `refresh_token` from every response. Presenting a consumed token is
        rejected, logged, and revokes every refresh token the user holds.

        So refresh single-flight. Two refreshes sent with the same token end
        the user's sessions: one wins, the other counts as a replay, and the
        winner's new refresh token is revoked with the rest. Run one refresh
        at a time, and have requests that fail while it is running wait for
        its result. If a refresh response is lost after the server processed
        it, the retry presents a spent token and the user has to log in again.

        Only the SHA-256 hash of a refresh token is stored, and lookup is by
        digest, so a database disclosure yields nothing a caller could send.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new access token and refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: |
            Invalid JSON, an unknown field, trailing data, or a missing
            `refresh_token`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: |
            The refresh token is unknown, expired, already used, or its owner
            has been deleted or deactivated. All of these return an identical
            body — which one it is would tell an attacker something.
            Presenting a token that was already used also revokes every
            refresh token the user holds, so each of their sessions must log
            in again once its access token expires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          description: |
            Too many attempts from this IP. The endpoint has its own per-IP
            budget, separate from login's, so a burst of refreshes does not
            block logins from the same address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/locations:
    post:
      tags: [locations]
      summary: Submit a single location report
      description: |
        Records a GPS fix from a driver's device. The driver identity comes
        from the JWT `sub` claim, not the request body. Requests are
        rate-limited to one report per driver per 5 seconds on average, with a
        burst of 2 so a report that network delay brings in early is not
        refused; additional reports receive HTTP 429. Request bodies are capped at 1 MiB.

        The driver must be assigned to `vehicle_id`, the vehicle must exist
        and be active, and the driver must have an active trip on it. A report
        never creates a vehicle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationReport'
      responses:
        '201':
          description: Location accepted and persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid JSON or payload validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Caller lacks the driver role, is not assigned to this vehicle (an
            unknown vehicle counts as not assigned), or the vehicle is inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The driver has no active trip on this vehicle (start one with
            `POST /api/v1/trips/start` first), or a `trip_id` or `route_id` the
            report carries differs from the active trip's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          description: Rate limit exceeded for this driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/locations/history:
    post:
      tags: [locations]
      summary: Upload fixes recorded while offline
      description: |
        Stores up to 500 fixes a driver's phone recorded while it could not
        reach the server, in location history only: they appear in trip
        playback and location history, never in the GTFS-RT feed. A fix may be
        up to 24 hours old; every other field is validated as in
        `POST /api/v1/locations`. A fix that fails validation is skipped and
        counted in `invalid` rather than refusing the batch. A fix already
        stored (the same vehicle, driver and timestamp), as when an upload is
        retried after its reply was lost, is not stored again and is counted in
        neither. The driver must be assigned to `vehicle_id`. Uploads are
        rate-limited per driver (a burst of 3, then one per 5 seconds). Request
        bodies are capped at 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationHistoryRequest'
      responses:
        '201':
          description: The batch was processed. The client can discard it.
          content:
            application/json:
              schema:
                type: object
                required: [saved, invalid]
                properties:
                  saved:
                    type: integer
                    description: Fixes newly stored.
                  invalid:
                    type: integer
                    description: Fixes that failed validation and were skipped.
        '400':
          description: Invalid JSON, an empty or oversized batch, or an invalid `vehicle_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks the driver role, or is not assigned to this vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          description: Too many history uploads from this driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the caller's token
      description: |
        Adds the caller's own `jti` to the revocation list, so the token stops
        being accepted before it would otherwise expire. A caller can only
        revoke the token it presents. A staff token without a `jti` is
        rejected with `401` before it gets here.
      responses:
        '204':
          description: Token revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/vehicles:
    get:
      tags: [vehicles]
      summary: List the vehicles assigned to the authenticated driver
      description: |
        Returns the active vehicles the calling driver is assigned to. The
        driver identity comes from the JWT `sub` claim, so there is no path
        or query parameter. Requires a driver or admin bearer token; a
        `viewer` token is refused with `403`. This is the driver-facing
        counterpart to `GET /api/v1/admin/vehicles`.
      responses:
        '200':
          description: |
            Vehicles assigned to this driver. Empty array when the driver has
            no active assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/map:
    get:
      tags: [map]
      summary: Where the driver app downloads its offline street map
      description: |
        Requires a driver or admin bearer token. `pmtiles_url` is the URL of
        the PMTiles map file the agency set with `MAP_PMTILES_URL`, or null
        when it has not set one. The server hands out only the URL: the agency
        hosts the file, and clients download it from there. A server older
        than this route answers 404, which a client should read the same as
        null.
      responses:
        '200':
          description: Where the map file is, if there is one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/rider/register:
    post:
      tags: [rider]
      summary: Register a rider device
      description: |
        Exchanges a device installation for a rider token. This is the only
        rider endpoint open to an unauthenticated caller.

        Registration is idempotent per installation: a known `installation_id`
        answers `200`, a new one `201`. The response carries the cadence the
        server wants, so clients take their batch size and interval from here
        rather than hard-coding them.

        Bodies are capped at 64 KiB and rate-limited per client.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiderRegisterRequest'
      responses:
        '200':
          description: Existing installation; the token is reissued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderRegisterResponse'
        '201':
          description: New installation registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderRegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          description: Too many registrations from this client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/rider/rides:
    post:
      tags: [rider]
      summary: Start a ride
      description: |
        Declares that the rider has boarded a trip, so their positions can be
        matched against its shape.

        `422` means the request was well-formed but the trip could not be
        matched against the loaded schedule; `503` means no schedule is
        loaded at all.
      security:
        - riderAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRideRequest'
      responses:
        '201':
          description: Ride started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartRideResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such trip in the loaded schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            A concurrent start for the same rider won the insert. Starting a
            ride while one is already in progress normally supersedes it — this
            is only reachable when two server instances race, and the client's
            retry resolves it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: The trip could not be matched against the schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rides are being started too quickly for this rider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/rider/rides/{id}/positions:
    parameters:
      - $ref: '#/components/parameters/RideIDPath'
    post:
      tags: [rider]
      summary: Upload a batch of positions
      description: |
        Submits a batch of fixes for a ride. The response reports what was
        accepted, whether the ride is now publishable, and whether the server
        ended it — a rider who has drifted off the route for long enough is
        ended server-side, reported through `ended` and `end_reason` rather
        than an error status.

        Batches are capped at 12 positions and 64 KiB, and rate-limited to
        the advertised reporting interval.
      security:
        - riderAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionsRequest'
      responses:
        '200':
          description: Batch processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such ride for this rider — either the id is not a UUID, or the
            ride belongs to someone else. The two are deliberately
            indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The ride is not in a state that accepts positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          description: Batches are arriving faster than the reporting interval allows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/rider/rides/{id}/end:
    parameters:
      - $ref: '#/components/parameters/RideIDPath'
    post:
      tags: [rider]
      summary: End a ride
      description: Closes a ride and reports what it contributed.
      security:
        - riderAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndRideRequest'
      responses:
        '200':
          description: Ride ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndRideResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such ride for this rider — either the id is not a UUID, or the
            ride belongs to someone else. The two are deliberately
            indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The ride has already ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          description: Too many requests from this rider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/rider/trips/{trip_id}/status:
    parameters:
      - $ref: '#/components/parameters/TripGTFSIDPath'
    get:
      tags: [rider]
      summary: Whether a trip is already covered
      description: |
        Tells a client whether a trip already has a trusted AVL feed or other
        riders reporting, so it can decide not to spend battery duplicating
        coverage.
      security:
        - riderAuth: []
      parameters:
        - in: query
          name: start_date
          required: false
          schema:
            type: string
            pattern: '^[0-9]{8}$'
          description: |
            GTFS service date as `YYYYMMDD`. Defaults to the service date the
            loaded schedule considers current.
      responses:
        '200':
          description: Coverage for this trip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripCoverage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such trip in the loaded schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /gtfs-rt/vehicle-positions:
    get:
      tags: [feed]
      summary: GTFS-RT Vehicle Positions feed
      description: |
        Returns a standards-compliant GTFS-RT `FeedMessage`. By default it
        carries both halves of the feed: driver vehicles that have reported
        within the staleness threshold (default 5 minutes), and trip estimates
        derived from rider reports. Use `source` to take one half.

        Defaults to protobuf; pass `?format=json` for the protojson-encoded
        form for debugging.

        Access depends on how the server is run. With `FEED_AUTH_ENABLED` the
        feed sits behind `requireAPIKey` and needs an `X-API-Key` header;
        without it the feed is public and the header is ignored. The guarded
        form is documented here, so a client built against this spec works
        either way.
      security:
        - apiKey: []
      parameters:
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [json]
          description: When set to `json`, returns the protojson-encoded feed.
        - in: query
          name: source
          required: false
          schema:
            type: string
            enum: [all, driver, rider]
            default: all
          description: |
            Which half of the feed to publish. Omitted or `all` returns both.
            An unrecognised value matches neither half, so it is rejected
            rather than served as an empty feed.
      responses:
        '200':
          description: GTFS-RT FeedMessage.
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
                description: Serialized GTFS-RT `FeedMessage` protobuf.
            application/json:
              schema:
                type: object
                description: protojson-encoded GTFS-RT `FeedMessage`.
        '400':
          description: '`source` was not one of `all`, `driver` or `rider`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: |
            The API key was missing, unknown or deactivated. Only reachable
            when the server runs with `FEED_AUTH_ENABLED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /gtfs-rt/trip-updates:
    get:
      tags: [feed]
      summary: GTFS-RT Trip Updates feed
      description: |
        Returns a standards-compliant GTFS-RT `FeedMessage` with one
        `TripUpdate` per driver vehicle, among those that have reported
        within the staleness threshold, whose delay against its trip's
        timetable the server measured from its latest report. The Java
        OneBusAway server builds its vehicles from a trip updates feed, so it
        needs this one alongside the positions feed.

        Each `TripUpdate` carries the trip as the positions feed describes it,
        the same `vehicle.id`, the report's timestamp capped as the positions
        feed caps it, `delay` in seconds (positive late), and one
        `stop_time_update` for the stop the positions feed names, with the
        same delay on its `arrival` and an arrival `time`, the stop's time in
        the timetable plus the delay. For a stop whose times `stop_times.txt`
        leaves blank, the timetable's time is the one interpolated between the
        timed stops either side. A vehicle is left out, rather than published
        as on time, when its delay is not known: no `trip_id`, a trip in
        `frequencies.txt`, off its route, not yet left its first stop or past
        its last, or more than 90 minutes early or late, which puts it on
        another run than the one it names. Rider-derived trips are never
        included.

        Defaults to protobuf; pass `?format=json` for the protojson-encoded
        form for debugging.

        Access is the positions feed's: with `FEED_AUTH_ENABLED` it sits
        behind `requireAPIKey` and needs an `X-API-Key` header; without it the
        feed is public and the header is ignored.
      security:
        - apiKey: []
      parameters:
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [json]
          description: When set to `json`, returns the protojson-encoded feed.
      responses:
        '200':
          description: GTFS-RT FeedMessage.
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
                description: Serialized GTFS-RT `FeedMessage` protobuf.
            application/json:
              schema:
                type: object
                description: protojson-encoded GTFS-RT `FeedMessage`.
        '401':
          description: |
            The API key was missing, unknown or deactivated. Only reachable
            when the server runs with `FEED_AUTH_ENABLED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags: [health]
      summary: Liveness probe
      description: Returns 200 if the process is serving requests.
      security: []
      responses:
        '200':
          description: Server is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: |
        Returns 200 if the server can reach the database within 2 seconds,
        or 503 if the database ping fails.
      security: []
      responses:
        '200':
          description: Server is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '503':
          description: Server is degraded (database unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/v1/admin/api-keys:
    get:
      tags: [admin]
      summary: List feed API keys
      description: |
        Returns one page of keys newest-first, deactivated ones included.
        Requires the `admin` or `viewer` role. The raw keys are never
        returned: only their hashes are stored.

        Paging is offset-based. The handler reads one row past `limit` to set
        `has_more`, so a truncated page is distinguishable from an exact fit.
      parameters:
        - $ref: '#/components/parameters/ListLimitQuery'
        - $ref: '#/components/parameters/ListOffsetQuery'
      responses:
        '200':
          description: One page of API keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin]
      summary: Create a feed API key
      description: |
        Requires the `admin` role. The response is the only place the raw key
        appears: only its hash is stored, so it cannot be recovered later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: Key created. `key` is shown once and never again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/api-keys/{id}:
    parameters:
      - $ref: '#/components/parameters/APIKeyIDPath'
    delete:
      tags: [admin]
      summary: Deactivate a feed API key
      description: |
        Sets `active = false`. The row is kept so `last_used_at` stays
        auditable. Requires the `admin` role.
      responses:
        '204':
          description: Key deactivated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/audit:
    get:
      tags: [admin]
      summary: List the audit log
      description: |
        Returns one page of the audit log newest-first: each change made to a
        vehicle, an account, a trip or an API key through the admin UI or this
        API, the changes the server made itself, and each sign-in and sign-out
        of an `admin` or `viewer` account, through the admin UI or this API,
        with the sign-ins to one that failed. A driver's sign-ins are not
        recorded, and neither is a token renewed with
        `POST /api/v1/auth/refresh`, a session that runs out, a failed sign-in
        to an email no account has or a `429`. The filters are the Audit log
        page's. Requires the `admin` or `viewer` role. A viewer's entries leave
        out `actor_ip`, as a viewer's Audit log page leaves out the address.

        A failed sign-in is answered without waiting for its entry, so a wrong
        password for an admin's account takes no longer to refuse than one for
        an unknown email. Unlike the others, such an entry can be lost if the
        server crashes or its database stops answering.

        Paging is offset-based. The handler reads one row past `limit` to set
        `has_more`, so a truncated page is distinguishable from an exact fit.
        With `AUDIT_LOG_RETENTION_PERIOD` set to a period, entries older than
        it are deleted hourly; by default every entry is kept.
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [vehicle, user, trip, api_key, session]
          description: |
            Only entries about this kind of object. `session` is the sign-ins,
            failed sign-ins and sign-outs. Omit for every kind.
        - in: query
          name: id
          required: false
          schema:
            type: string
          description: |
            Only entries about this one object: a vehicle's id, or an
            account's, trip's or API key's number; for a `session`, its
            account's number. Needs `type`; an `id` without it is a `400`.
        - in: query
          name: actor
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
          description: |
            Only what the account with this user id did: the changes it made,
            and its sign-ins and sign-outs. Failed sign-ins to it are left out,
            since who was at them is unknown.
        - $ref: '#/components/parameters/ListLimitQuery'
        - $ref: '#/components/parameters/ListOffsetQuery'
      responses:
        '200':
          description: One page of the audit log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/gtfs/routes:
    get:
      tags: [gtfs]
      summary: List routes in the loaded schedule
      description: |
        Requires a driver, admin or viewer bearer token (the admin's map and
        search read it too). Registered only when a GTFS schedule is
        configured; without one the route does not exist and the server
        answers 404.
      responses:
        '200':
          description: Routes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRoutes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/gtfs/routes/{route_id}/trips:
    parameters:
      - $ref: '#/components/parameters/RouteIDPath'
    get:
      tags: [gtfs]
      summary: List a route's trips on a service date
      description: Requires a driver, admin or viewer bearer token.
      parameters:
        - $ref: '#/components/parameters/ServiceDateQuery'
      responses:
        '200':
          description: Trips on this route for the service date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRouteTrips'
        '400':
          description: '`date` was not `YYYYMMDD`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such route in the loaded schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/gtfs/trips/{trip_id}:
    parameters:
      - $ref: '#/components/parameters/TripGTFSIDPath'
    get:
      tags: [gtfs]
      summary: Get a trip's shape, stops and matching thresholds
      description: |
        Returns everything a client needs to follow a trip: its shape, its
        stops with scheduled times, and the thresholds the server uses when
        judging whether a vehicle is on route and on time. Requires a driver,
        admin or viewer bearer token.
      parameters:
        - $ref: '#/components/parameters/ServiceDateQuery'
      responses:
        '200':
          description: Trip detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogTrip'
        '400':
          description: '`date` was not `YYYYMMDD`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such trip in the loaded schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The trip exists but does not run on the requested date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/admin/rider/status:
    get:
      tags: [admin]
      summary: Rider subsystem health
      description: |
        Reports the rider engine's state: the schedule snapshot it is matching
        against, the trusted feeds it corroborates with, and current rider and
        ride counts. Requires the `admin` or `viewer` role.

        Rider mode being off is a fact about the server, not an error — a
        disabled server answers `200` with `enabled: false` and omits the
        detail sections rather than returning `404`.
      responses:
        '200':
          description: Rider subsystem status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/rider/rides:
    get:
      tags: [admin]
      summary: List rider rides
      description: |
        Lists rides newest-first, filtered by status. Requires the `admin` or
        `viewer` role. Like the other admin lists, one row beyond `limit` is
        read to set `has_more`.
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [active, ended]
            default: active
          description: Which rides to return. Defaults to `active`.
        - in: query
          name: limit
          required: false
          schema:
            $ref: '#/components/schemas/RiderRideListLimit'
          description: Maximum number of rides to return.
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of rides to skip.
      responses:
        '200':
          description: Matching rides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRides'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/status:
    get:
      tags: [admin]
      summary: System status and vehicle counts
      description: Requires the `admin` or `viewer` role.
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/vehicles:
    get:
      tags: [admin]
      summary: List vehicles
      description: |
        Returns one page of vehicles newest-first, deactivated ones included.
        Requires the `admin` or `viewer` role.

        Paging is offset-based. The handler reads one row past `limit` to set
        `has_more`, so a truncated page is distinguishable from an exact fit.
      parameters:
        - $ref: '#/components/parameters/ListLimitQuery'
        - $ref: '#/components/parameters/ListOffsetQuery'
      responses:
        '200':
          description: One page of vehicles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin]
      summary: Create or update a vehicle
      description: |
        Upserts by `id`. Requires the `admin` role. Request bodies are capped
        at 8 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertVehicleRequest'
      responses:
        '200':
          description: Vehicle created or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/vehicles/live:
    get:
      tags: [admin]
      summary: Snapshot of currently reporting vehicles
      description: |
        Returns every vehicle the tracker considers active — those that have
        reported within `STALENESS_THRESHOLD` — joined with the vehicle's
        label and, where a trip is running, that trip's route and driver.
        Ordered by `vehicle_id`. Requires the `admin` or `viewer` role.

        This reads the in-memory tracker rather than the locations table, so
        it reflects live state, not history. Use
        `GET /api/v1/admin/vehicles/{vehicleID}/locations` for the recorded
        trail.
      responses:
        '200':
          description: Active vehicles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveVehicles'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/VehicleIDPath'
    get:
      tags: [admin]
      summary: Get a vehicle by id
      description: Requires the `admin` or `viewer` role.
      responses:
        '200':
          description: Vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [admin]
      summary: Deactivate a vehicle
      description: |
        Sets `active = false`. The row is preserved so historical trips keep
        referencing it. Requires the `admin` role.
      responses:
        '204':
          description: Vehicle deactivated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/vehicles/{vehicleID}/locations:
    parameters:
      - $ref: '#/components/parameters/VehicleIDPathNamed'
    get:
      tags: [admin]
      summary: Export a vehicle's location history
      description: |
        Returns the GPS fixes recorded for a vehicle within a time window,
        as JSON or as a CSV download. Requires the `admin` or `viewer` role.

        The window defaults to the 24 hours ending at `to` rather than to
        all of history, so an unbounded request cannot trigger a full-table
        scan. Note that `from` defaults relative to `to`, not to the current
        time: a `to` in the past selects the 24 hours ending there instead
        of failing the `from <= to` check.

        Results are capped by `limit`. The handler reads one row beyond the
        cap to set `has_more`, so a truncated response is distinguishable
        from an exact fit. A CSV body has no field to carry that in, so the
        CSV variant reports it in the `X-Has-More` response header.
      parameters:
        - in: query
          name: from
          required: false
          schema:
            type: integer
            format: int64
          description: |
            Start of the window, Unix seconds, inclusive. Defaults to
            `to - 86400`. Must be less than or equal to `to`.
        - in: query
          name: to
          required: false
          schema:
            type: integer
            format: int64
          description: End of the window, Unix seconds, inclusive. Defaults to the current server time.
        - in: query
          name: limit
          required: false
          schema:
            $ref: '#/components/schemas/HistoryLimit'
          description: Maximum number of fixes to return.
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: |
            Response encoding. `csv` returns `text/csv` with a
            `Content-Disposition: attachment` header naming the file
            `<vehicle_id>_locations.csv`.
      responses:
        '200':
          description: |
            Location history. The CSV variant carries the same rows with the
            header `timestamp,latitude,longitude,bearing,speed,accuracy,trip_id,received_at`;
            absent `bearing` / `speed` / `accuracy` render as empty cells, and
            `trip_id` is prefixed with `'` when it starts with a character a
            spreadsheet would treat as a formula.
          headers:
            X-Has-More:
              description: |
                Sent with the CSV variant, where it stands in for the JSON
                body's `has_more`: `true` when more fixes exist in the window
                than `limit` allowed, `false` when the file is complete.
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationHistory'
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No vehicle exists with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/trips:
    get:
      tags: [admin]
      summary: List trips
      description: |
        Returns trips newest-first with the vehicle label and driver name
        resolved. Requires the `admin` or `viewer` role.

        Paging is offset-based. The handler reads one row past `limit` to set
        `has_more`, so a truncated page is distinguishable from an exact fit.
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: ['', active, completed]
          description: Filter by trip status. Omit or pass an empty string for all trips.
        - in: query
          name: vehicle_id
          required: false
          schema:
            type: string
          description: Restrict to one vehicle. Omit for all vehicles.
        - in: query
          name: user_id
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
          description: |
            Restrict to one driver. Omit for all drivers; a present value must
            be a positive integer.
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: |
            Case-insensitive substring search over driver name, route id, and
            GTFS trip id. It does not search vehicle fields — use `vehicle_id`
            for that.
        - in: query
          name: limit
          required: false
          schema:
            $ref: '#/components/schemas/TripListLimit'
          description: Maximum number of trips to return.
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of trips to skip.
      responses:
        '200':
          description: Matching trips.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/trips/{id}:
    parameters:
      - $ref: '#/components/parameters/TripIDPath'
    get:
      tags: [admin]
      summary: Get a trip by id
      description: |
        Returns one trip with its vehicle label and driver name resolved.
        Requires the `admin` or `viewer` role.

        As with the trail endpoint, a non-numeric `id` returns `404` rather
        than `400` — an unparseable id is treated as a trip that does not
        exist.
      responses:
        '200':
          description: Trip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No trip exists with this id, or the id is not a number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/trips/{id}/locations:
    parameters:
      - $ref: '#/components/parameters/TripIDPath'
    get:
      tags: [admin]
      summary: Get a trip with its recorded trail
      description: |
        Returns the trip summary together with every location fix recorded
        against it, oldest first. Requires the `admin` or `viewer` role.

        A non-numeric `id` returns `404` rather than `400` — the handler
        treats an unparseable id as a trip that does not exist.
      responses:
        '200':
          description: |
            Trip and its trail. `points` is an empty array for a trip with no
            recorded fixes; the `trip` object is still returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripTrail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No trip exists with this id, or the id is not a number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/trips/{id}/end:
    parameters:
      - $ref: '#/components/parameters/TripIDPath'
    post:
      tags: [admin]
      summary: End any driver's active trip
      description: |
        Ends the active trip with this id, whichever driver started it, and
        returns the ended trip. Requires the `admin` role. There is no request
        body.

        Use it when a driver is locked out by a trip their phone no longer
        knows about: `POST /api/v1/trips/start` answers `409` until that trip
        ends. The trip ends exactly as the driver's own `POST /api/v1/trips/end`
        leaves it: `status` becomes `completed` and `end_time` is set.

        A trip that has already ended returns `409`, not `404`, so a client can
        tell "already done" from "wrong id". As on the other trip endpoints, a
        non-numeric `id` returns `404`.
      responses:
        '200':
          description: The ended trip, with `status` `completed` and `end_time` set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No trip exists with this id, or the id is not a positive number
            (`trip not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The trip exists but has already ended (`trip is not active`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/alerts:
    get:
      tags: [admin]
      summary: Vehicles that have gone quiet, are off route, are not moving, are bunched or have not started a block's next trip
      description: |
        The same list the admin UI's Alerts page shows, worked out on request
        from the active trips, the trips started in the last day, the reports
        the server has accepted since it started, and where the latest of them
        put each vehicle on its trip. Requires the `admin` or `viewer` role.

        - `quiet`: the vehicle has sent no report for longer than
          `ALERT_QUIET_AFTER` (3m by default). Before its first report on the
          trip it is counted from the trip's start, and after a server restart
          from the restart.
        - `off_route`: the vehicle's reports have stayed more than
          `ALERT_OFF_ROUTE_DISTANCE` (`RIDER_MAX_SHAPE_DISTANCE`, 60 m, by
          default) from its trip's shape for longer than
          `ALERT_OFF_ROUTE_AFTER` (5m by default), counted to its latest
          report. A fix counts only when its whole accuracy circle is on one
          side of that distance; one near the shape ends the spell. Reports
          count only once the vehicle has been near the shape on this trip,
          so one on its way to the route from a depot or a layover spot is
          not off route. A trip with no shape in the schedule, or with only a
          route, is never off route.
        - `not_moving`: the vehicle is still reporting but has stayed within
          50 m of where it is now for at least `ALERT_STOPPED_AFTER` (10m by
          default). A vehicle waiting at its first stop counts too.
        - `not_started`: the vehicle that ran the latest trip of a GTFS block
          today has no trip running, and the block's next trip that day has
          not started `ALERT_NOT_STARTED_AFTER` (5m by default) after it was
          due to leave. It lasts until that trip is due to arrive. `trip` is
          the trip the vehicle ran last and `next_trip` the one not started.
          Only a block a vehicle has run a trip on counts, so a block no
          vehicle with the app is working never raises one, nor does a trip
          with no `block_id` or a headway trip.
        - `bunched`: the vehicle has run less than 25% of the scheduled gap
          behind the vehicle ahead of it for `ALERT_BUNCHED_AFTER` (3m by
          default), counted over their reports. The vehicle ahead is the
          nearest one on the same route, direction and shape that also stops
          there. The spacing is the running time the vehicle's timetable gives
          from its place to the vehicle ahead's, plus how much later it
          reported. The scheduled gap is the one the service report's `gaps`
          judge by, at the stop the vehicle is at or heading to, so only
          trips run from `frequencies.txt`, and timetabled trips due there
          as part of a timetable every 12 minutes or more often, are judged.
          A vehicle off its route, not yet past its first stop, heading to
          or past its last stop, or quiet is not judged, nor is one with no
          driver vehicle ahead: Rider mode's vehicles are not counted.
          `ahead` names the vehicle ahead.

        A trip has at most one alert: a quiet vehicle is not also reported as
        off route, not moving or bunched, an off-route one is not also
        reported as not moving or bunched, and a vehicle not moving is not also
        reported as bunched. An ended trip has none. The list is ordered
        longest-running first. Nothing is sent anywhere: a client polls this
        endpoint.
      responses:
        '200':
          description: The current alerts, longest-running first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/reports/service:
    get:
      tags: [admin]
      summary: One service day's report of trips run and on-time performance
      description: |
        The same report the admin UI's Reports page shows: for each route with
        service that day, the trips the GTFS calendar and calendar_dates
        schedule, how many a driver ran, and how close to schedule they ran.
        It is worked out on request from the stored trips and location points
        and the loaded schedule. Requires the `admin` or `viewer` role.

        A driver's trip counts as a run of its GTFS trip on the service day
        whose scheduled run is nearest to when the driver started it, within
        12 hours. Several driver trips of one GTFS trip are judged at each
        stop on the first of them known to have passed it.

        Each run is judged at its trip's timepoints, or at every stop when the
        feed marks none. A stop is judged on departure, when the vehicle is
        more than 30 m past it, and the last stop on arrival, when the vehicle
        comes within 30 m of it. The time is interpolated between the fixes
        either side; with no fix within 2 minutes on either side the stop is
        unknown. A stop passed from `on_time_early_s` early to
        `on_time_late_s` late (`REPORT_ON_TIME_EARLY` and
        `REPORT_ON_TIME_LATE`) is on time. A trip whose shape the feed does
        not give is unknown at every stop.

        A trip in frequencies.txt, by headway or at exact times, has no
        timetable for any one run, so none of its stops is judged. It counts
        once for each run its windows schedule, and a driver's trip is a run
        of the service day whose window holds its start. Each run a driver
        started fills the scheduled run nearest it that no earlier run
        filled, so a trip never counts more runs than scheduled.

        A route's frequent service is measured by the gaps between its
        vehicles, for each direction (`direction_id`, or the headsign when
        the feed gives none): its trips in frequencies.txt instead of On
        time, and its timetabled trips as well as On time, at a stop where
        the timetable runs every 12 minutes or more often. At each stop On
        time would judge on any of the direction's trips, except a trip's
        last, every run passes when it is 30 m past the stop, worked out as
        a departure is above, and the passings are put in time order
        whichever vehicles made them. A gap is the time from one passing to
        the next, judged against the scheduled gap when the later vehicle
        passed. Each trip in frequencies.txt due at the stop then adds a run
        every headway, from the row its run would have left the first stop
        in, or the row that ended less than a headway before. The timetable
        adds a run every spacing between two departures in a row no more
        than 12 minutes apart: the spacing up to the departure nearest the
        passing, so a vehicle on time is judged against the gap riders
        waiting for it were promised, not the one after it. The rates add,
        so two trips every 10 minutes make it every 5 minutes, rounded to
        the second. A trip, or the timetable, that began at the stop less
        than a headway before another's service there ended, or after,
        takes over from its first run, and the other adds nothing more, so
        one trip handing over to the next does not halve the gap. Service
        runs on across rows, or frequent spacings, that follow one another
        without a break, and into a trip beginning just as it ends, which
        then takes over. A gap is judged only between two passings in one
        stretch of service, the rows' windows and the timetable's frequent
        spacings at the stop each held a headway or spacing past its end,
        so the first passing of a stretch has no gap. A timetabled trip
        whose departure from a stop has no other within 12 minutes of it is
        not in the order there, and adds nothing to the scheduled gap. A run
        whose passing at a stop is unknown passed some time between its fixes
        either side, its trip's start and its trip's end standing in for a
        fix that is not there; a gap it could fall in is unknown, not judged.
        A run whose trail stops short of the stop passed it no later than
        its trip's scheduled run time and 90 minutes after its last fix, or
        its start when it sent none, whether it is still running or ended
        later than that, so a trip a driver forgot to end leaves gaps unknown
        only until then. If it ended within 2 minutes of its last fix, it did
        not serve the stop and is not in the order. Only driver trips are
        counted.

        A day before today's service date is kept in memory once its last
        scheduled arrival is an hour past, until the schedule is next
        reloaded; today is worked out again on every request.
      parameters:
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
          description: The service day, `YYYY-MM-DD`. Defaults to yesterday in the agency's timezone.
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: |
            Response encoding. `csv` returns `text/csv` with a
            `Content-Disposition: attachment` header naming the file
            `service-report-<date>.csv`.
      responses:
        '200':
          description: |
            The report. The CSV variant has one line per route under the header
            `date,route_id,short_name,long_name,trips_scheduled,trips_run,stops_on_time,stops_early,stops_late,stops_unknown,on_time_percent,unknown_percent`,
            the percentages to one decimal place and empty where the JSON has
            null. A route id or name starting with a character a spreadsheet
            would treat as a formula is prefixed with `'`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceReport'
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: No GTFS schedule is loaded (`schedule data unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/health:
    get:
      tags: [admin]
      summary: Report and feed outcomes, per minute for the last hour, per hour and since start
      description: |
        The same counts the admin UI's Feed health page shows. Every response to
        a driver's position report (`POST /api/v1/locations` and
        `POST /api/v1/locations/history`) and to a feed fetch
        (`GET /gtfs-rt/vehicle-positions` or `GET /gtfs-rt/trip-updates`, in
        either format) is counted by its status, including requests refused
        before they reach the handler. The
        minutes and the total are kept in memory: a restart starts them again
        from `since`. Each hour is saved to the database when it closes, and
        the hour in progress when the server stops, so `hours` is kept
        through a restart; `LOCATION_RETENTION_PERIOD` deletes the hours older
        than it. Requires the `admin` or `viewer` role.

        A report is `accepted` (2xx), `invalid` (400, 409 for a report that
        does not match the driver's running trip, 415 and any other 4xx),
        `unauthorized` (401 or 403), `rate_limited` (429) or a `server_error`
        (5xx). A feed fetch is `served` (2xx), `refused` (401: a missing,
        unknown or inactive API key), `invalid` (any other 4xx, such as an
        unknown `source`) or a `server_error` (5xx).
      parameters:
        - in: query
          name: days
          required: false
          schema:
            type: integer
            enum: [1, 7]
            default: 1
          description: How many days of hours `hours` lists.
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedHealth'
        '400':
          description: '`days` is not 1 or 7.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: List users
      description: |
        Returns one page of users newest-first, deactivated ones included.
        Requires the `admin` or `viewer` role.

        Paging is offset-based. The handler reads one row past `limit` to set
        `has_more`, so a truncated page is distinguishable from an exact fit.
      parameters:
        - $ref: '#/components/parameters/ListLimitQuery'
        - $ref: '#/components/parameters/ListOffsetQuery'
      responses:
        '200':
          description: One page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin]
      summary: Create a user
      description: |
        Requires the `admin` role. Request bodies are capped at 1 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: |
            Invalid request. An email that is not a bare address, such as
            `Name <driver@example.com>` or one with surrounding spaces, returns
            `email is not valid`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserIDPath'
    get:
      tags: [admin]
      summary: Get a user by id
      description: Requires the `admin` or `viewer` role.
      responses:
        '200':
          description: User.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [admin]
      summary: Update a user
      description: |
        Updates name, email, role and, optionally, password or active status. Requires the `admin` role. Request
        bodies are capped at 1 KiB. Making an account a `viewer` unassigns
        every vehicle assigned to it in the same change, since a viewer can't
        drive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: |
            Invalid request. An email that is not a bare address, such as
            `Name <driver@example.com>` or one with surrounding spaces, returns
            `email is not valid`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Email already exists, or the change makes the account a viewer while
            it has a trip running (`end this account's running trip before making
            it a viewer`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: |
            The user is the last active admin, and the update would leave no
            active admin. A role change alone returns `cannot demote the last
            active admin`; a deactivation, with or without a role change,
            returns `cannot deactivate the last active admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [admin]
      summary: Delete a user
      description: Requires the `admin` role.
      responses:
        '204':
          description: User deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: User has trips and cannot be deleted; deactivate the user instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/assignments:
    post:
      tags: [admin]
      summary: Assign a driver to a vehicle
      description: |
        Links a driver to a vehicle. A driver must hold an assignment for a
        vehicle before `POST /api/v1/trips/start` will accept a trip on it.
        Requires the `admin` role. Request bodies are capped at 1 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Assignment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The referenced user or vehicle does not exist. Surfaced from the
            foreign-key violation, so the message is either `user not found`
            or `vehicle not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            This driver is already assigned to this vehicle, the vehicle is
            inactive, or the account is a viewer (`a viewer can't drive, so no
            vehicles can be assigned to one`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/vehicles:
    parameters:
      - $ref: '#/components/parameters/UserIDPath'
    get:
      tags: [admin]
      summary: List the vehicles assigned to a driver
      description: |
        Requires the `admin` or `viewer` role. The handler validates the id
        but does not check that the user exists, so an unknown id returns
        `200` with an empty array rather than `404`.
      responses:
        '200':
          description: Assignments held by this driver.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{userID}/vehicles/{vehicleID}:
    parameters:
      - $ref: '#/components/parameters/AssignmentUserIDPath'
      - $ref: '#/components/parameters/VehicleIDPathNamed'
    delete:
      tags: [admin]
      summary: Remove a driver's vehicle assignment
      description: |
        Deletes the assignment linking a driver to a vehicle. Requires the
        `admin` role. Unlike the other delete endpoints in this API, this one
        answers `200` with a status body rather than `204`.

        While the driver has an active trip on the vehicle the assignment is
        kept and the answer is `409`: without it, every location report from
        that trip would be refused. End the trip first.
      responses:
        '200':
          description: Assignment removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No assignment links this driver to this vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The driver has an active trip on this vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/vehicles/{id}/users:
    parameters:
      - $ref: '#/components/parameters/VehicleIDPath'
    get:
      tags: [admin]
      summary: List the drivers assigned to a vehicle
      description: |
        Requires the `admin` or `viewer` role. The handler validates the id
        but does not check that the vehicle exists, so an unknown id returns
        `200` with an empty array rather than `404`.
      responses:
        '200':
          description: |
            Assignments on this vehicle. Each item is the same `Assignment`
            object returned by the user-scoped listing, so `vehicle_id` is
            constant across the array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/trips:
    get:
      tags: [trips]
      summary: List the authenticated driver's own trips
      description: |
        Returns the calling driver's trips, newest first, the running one
        included. The driver identity comes from the JWT `sub` claim, so no
        parameter can ask for anyone else's. Requires a driver or admin bearer
        token; a `viewer` token is refused with `403`. This is the
        driver-facing counterpart to `GET /api/v1/admin/trips`.
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            $ref: '#/components/schemas/TripListLimit'
          description: Maximum number of trips to return.
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of trips to skip.
      responses:
        '200':
          description: The driver's trips.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTripList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/trips/start:
    post:
      tags: [trips]
      summary: Start a trip
      description: |
        Creates a new active trip for the authenticated driver. The driver
        must be assigned to the vehicle and must not already have an active
        trip. A non-empty `route_id` or `gtfs_trip_id` must be in the loaded
        GTFS schedule, and the trip must run on the route; otherwise 400.
        Request bodies are capped at 4 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTripRequest'
      responses:
        '201':
          description: Trip started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Driver is not assigned to this vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The driver already has an active trip, another driver has an
            active trip on this vehicle, or the vehicle is inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/trips/end:
    post:
      tags: [trips]
      summary: End an active trip
      description: |
        Ends the trip and removes its vehicle from the GTFS-RT feed at once;
        later reports for the vehicle are refused until a new trip starts.
        Request bodies are capped at 1 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndTripRequest'
      responses:
        '200':
          description: Trip ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No active trip matched the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT bearer token issued by `POST /api/v1/auth/login`. Signed HS256,
        `iss: vehicle-positions-api`. Its lifetime is whatever the server's
        `ACCESS_TOKEN_TTL` is set to, so read `expires_in` from the login or
        refresh response rather than assuming a fixed window.

    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        A feed key created by `POST /api/v1/admin/api-keys`. It gates both
        GTFS-RT feeds only when the server runs with `FEED_AUTH_ENABLED`; with
        the flag off the feeds are public and the header is ignored.

    riderAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by `POST /api/v1/rider/register`, carrying the `rider`
        role. It is not interchangeable with the driver/admin token from
        `POST /api/v1/auth/login`: `requireRider` accepts only the rider
        role, and the rest of the API rejects it.

  parameters:
    VehicleIDPath:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/VehicleID'
      description: Vehicle identifier.
    UserIDPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: User identifier.
    AssignmentUserIDPath:
      name: userID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: User identifier.
    # Two components describe the same vehicle id because the routes spell the
    # path variable differently: most use {id}, while the assignment-delete and
    # location-history routes use {vehicleID}. OpenAPI requires `name` to match
    # the template variable, so the pair cannot be collapsed.
    ListLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ListLimit'
      description: Maximum number of rows to return.
    ListOffsetQuery:
      name: offset
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ListOffset'
      description: Number of rows to skip.
    RideIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Ride identifier returned by `POST /api/v1/rider/rides`.
    APIKeyIDPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: API key identifier.
    RouteIDPath:
      name: route_id
      in: path
      required: true
      schema:
        type: string
      description: GTFS route identifier.
    ServiceDateQuery:
      name: date
      in: query
      required: false
      schema:
        type: string
        pattern: '^[0-9]{8}$'
      description: |
        GTFS service date as `YYYYMMDD`. Defaults to the schedule's current
        service date.
    TripGTFSIDPath:
      name: trip_id
      in: path
      required: true
      schema:
        type: string
      description: GTFS trip identifier from the loaded schedule.
    TripIDPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Trip identifier.
    VehicleIDPathNamed:
      name: vehicleID
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/VehicleID'
      description: Vehicle identifier.

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: |
        Caller lacks the required role: a driver or rider token on an admin
        route, a viewer token on an admin route that changes something or on a
        driver-facing route, or a staff token on a rider route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request body exceeded the handler's size limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Content-Type must be `application/json`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ScheduleUnavailable:
      description: |
        No GTFS schedule is loaded, so the rider engine cannot match trips.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Every vehicle-id-shaped field references this schema instead of
    # restating the constraints, so the drift guard has a single place to
    # compare against vehicleIDPattern / maxVehicleIDLength in handlers.go.
    VehicleID:
      type: string
      minLength: 1
      maxLength: 50
      pattern: '^[a-zA-Z0-9._-]+$'
      description: |
        Agency-assigned vehicle identifier. Constraints mirror
        `maxVehicleIDLength` and `vehicleIDPattern` in `handlers.go`.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message (matches the `writeJSON` helper).

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Matched to the account in any case.
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [token, access_token, refresh_token, expires_in]
      description: |
        Returned by both `POST /api/v1/auth/login` and
        `POST /api/v1/auth/refresh`, so one client model parses both.
      properties:
        token:
          type: string
          deprecated: true
          description: |
            Deprecated alias repeating `access_token` verbatim, so it expires
            with it after `expires_in` seconds. It stays in the response for
            good, with no planned removal, so clients written against the
            original single-token response keep parsing it, but a client that
            never calls `POST /api/v1/auth/refresh` gets a `401` once it
            expires. New clients should read `access_token`.
        access_token:
          type: string
          description: JWT bearer token (HS256), valid for `expires_in` seconds.
        refresh_token:
          type: string
          description: |
            Opaque single-use token used to obtain the next access token. Not a
            JWT; 32 random bytes, hex-encoded.
        expires_in:
          type: integer
          # The example is the server's own default, pinned to
          # defaultAccessTokenTTL by TestOpenAPI_ConstraintsMatchCode. It is the
          # only place this spec states that number.
          example: 900
          description: |
            Access token lifetime in seconds, from `ACCESS_TOKEN_TTL`.

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: |
            The `refresh_token` from the most recent login or refresh response.
            Each one works once.

    LocationHistoryRequest:
      type: object
      additionalProperties: false
      required: [vehicle_id, points]
      properties:
        vehicle_id:
          $ref: '#/components/schemas/VehicleID'
        points:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/HistoryPoint'

    HistoryPoint:
      type: object
      additionalProperties: false
      required: [latitude, longitude, timestamp]
      description: One fix in a history upload; the fields mean what they mean in LocationReport.
      properties:
        trip_id:
          type: string
        route_id:
          type: string
        start_date:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        bearing:
          type: [number, 'null']
        speed:
          type: [number, 'null']
        accuracy:
          type: [number, 'null']
        timestamp:
          type: integer
          format: int64

    LocationReport:
      type: object
      additionalProperties: false
      required: [vehicle_id, latitude, longitude, timestamp]
      description: |
        A single GPS fix. Beyond the per-field constraints below, the handler
        rejects reports where `latitude` and `longitude` are *both* zero —
        null island is far likelier to be a failed fix than a real position.
        That is a cross-field rule no JSON Schema keyword can express, so it
        is stated here rather than encoded.
      properties:
        vehicle_id:
          $ref: '#/components/schemas/VehicleID'
        trip_id:
          type: string
          maxLength: 100
          description: |
            GTFS `trip_id` when the driver knows it. Leave empty when only the
            route is known — it must never carry a route id.
        route_id:
          type: string
          maxLength: 100
          description: |
            GTFS `route_id`. Optional, but the only thing a consumer can match
            on when `trip_id` is empty.
        start_date:
          type: string
          pattern: '^([0-9]{8})?$'
          description: |
            The trip's service date, `YYYYMMDD` in the agency's local time, and
            a real calendar date. Optional, but meaningless alone: sending it
            without `trip_id` or `route_id` is rejected with 400.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        bearing:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 360
          description: Compass heading in degrees. May be null or omitted if unknown.
        speed:
          type: [number, 'null']
          format: double
          minimum: 0
          description: |
            Ground speed in metres per second. Rejected if negative; there is
            no upper bound. May be null or omitted if unknown.
        accuracy:
          type: [number, 'null']
          format: double
          description: |
            GPS horizontal accuracy in metres. May be null or omitted if
            unknown. Unlike `bearing` and `speed`, this field is not
            validated — any value the JSON decoder accepts is stored.
        timestamp:
          type: integer
          format: int64
          minimum: 1
          description: |
            Unix seconds. Must be positive and within 5 minutes of the server
            clock in either direction; reports outside that window are
            rejected with 400.
        occupancy_status:
          type: string
          enum:
            - EMPTY
            - MANY_SEATS_AVAILABLE
            - FEW_SEATS_AVAILABLE
            - STANDING_ROOM_ONLY
            - CRUSHED_STANDING_ROOM_ONLY
            - FULL
            - NOT_ACCEPTING_PASSENGERS
          description: |
            How full the vehicle is, as the driver sees it: a GTFS-RT
            `OccupancyStatus` name, spelled exactly as listed. Omit it when
            the driver has not said; any other value is rejected with 400.
            The feed publishes it as `occupancy_status` on the vehicle's
            entity while the vehicle's latest report carries it, so a client
            sends it with every report for as long as the driver's choice
            stands. A report without it clears it from the feed.

    UpsertVehicleRequest:
      type: object
      description: |
        An `id` of `.` or `..` is refused, as a path can't hold it.
      additionalProperties: false
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/VehicleID'
        label:
          type: string
          maxLength: 255
        agency_tag:
          type: string
          maxLength: 255

    VehicleList:
      type: object
      required: [count, has_more, vehicles]
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of vehicles in `vehicles`, after the `limit` cap is applied.
        has_more:
          type: boolean
          description: True when more vehicles match the filter than this page returned.
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'

    Vehicle:
      type: object
      required: [id, label, agency_tag, active, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/VehicleID'
        label:
          type: string
        agency_tag:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: |
            When the vehicle was added or an admin last changed it. A location
            report does not move it.

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, role]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          description: Stored lower-case. An email another account has in any case is a duplicate (409).
        password:
          $ref: '#/components/schemas/Password'
        role:
          type: string
          enum: [driver, admin, viewer]

    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          description: Stored lower-case. An email another account has in any case is a duplicate (409).
        role:
          type: string
          enum: [driver, admin, viewer]
        password:
          anyOf:
            - $ref: '#/components/schemas/Password'
            - const: ''
          description: |
            Optional. A non-empty value replaces the user's password, held to
            the same rules as on create. Omit it, or send an empty string, to
            keep the current one.
        active:
          type: boolean
          description: |
            Optional. When present, activates or deactivates the user account.
            Deactivating revokes all refresh tokens held by the user. Omitting
            the field leaves the flag unchanged.

    # Shared by create and update so the length rules live in one place. The
    # upper bound is bcrypt's 72-byte input limit, which JSON Schema's
    # character-based maxLength cannot express exactly, so it is stated in the
    # description instead.
    Password:
      type: string
      format: password
      minLength: 8
      description: |
        At least 8 characters and at most 72 bytes — bcrypt's input limit. A
        multi-byte password can exceed 72 bytes well before 72 characters.

    UserList:
      type: object
      required: [count, has_more, users]
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of users in `users`, after the `limit` cap is applied.
        has_more:
          type: boolean
          description: True when more users match the filter than this page returned.
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, name, email, role, active, created_at, updated_at, last_seen_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
          description: Lower-case. Sign-in matches it in any case.
        role:
          type: string
          enum: [driver, admin, viewer]
        active:
          type: boolean
          description: |
            False once the account has been deactivated. Deactivated users
            keep their rows so historical trips still resolve a driver.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_seen_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the user last signed in with their password or renewed their
            session with a refresh token, in UTC. Null until they next do
            either, which includes a user created since and one who has not
            signed in since the server began recording it. Signing in does not
            move `updated_at`.

    LiveVehicles:
      type: object
      required: [count, vehicles]
      properties:
        count:
          type: integer
          minimum: 0
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/LiveVehicleEntry'

    LiveVehicleEntry:
      type: object
      description: |
        A vehicle's current tracker state. `trip_db_id`, `route_id`, and
        `driver_name` are populated only while a trip is running on the
        vehicle and are explicitly `null` otherwise — none carry `omitempty`,
        so the key is always present. Likewise `bearing` and `speed` are
        `null` when the device did not report them, keeping "unknown"
        distinct from a real zero, and `stop_id`, `stop_sequence` and
        `current_status` are all `null` when the vehicle's latest report
        named no stop of its trip.
      required:
        - vehicle_id
        - label
        - latitude
        - longitude
        - bearing
        - speed
        - gtfs_trip_id
        - trip_db_id
        - route_id
        - driver_name
        - stop_id
        - stop_sequence
        - current_status
        - schedule_deviation_s
        - reported_at
        - updated_at
      properties:
        vehicle_id:
          $ref: '#/components/schemas/VehicleID'
        label:
          type: string
          description: |
            The vehicle's label, or the vehicle id when the vehicle has no
            row in the vehicles table.
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        bearing:
          type: [number, 'null']
          format: double
        speed:
          type: [number, 'null']
          format: double
        gtfs_trip_id:
          type: string
          description: The GTFS trip id from the last location report. Empty when none was sent.
        trip_db_id:
          type: [integer, 'null']
          format: int64
          description: Database id of the active trip, or null when no trip is running.
        route_id:
          type: [string, 'null']
        driver_name:
          type: [string, 'null']
        stop_id:
          type: [string, 'null']
          description: |
            The GTFS stop the vehicle is at or heading to on its trip, as the
            GTFS-RT feed's `stop_id` names it for the same vehicle. Placed when
            the report was accepted; null when it named no stop.
        stop_sequence:
          type: [integer, 'null']
          description: |
            That stop's `stop_sequence` in the trip, as the feed's
            `current_stop_sequence`. May be 0; null only when `stop_id` is.
        current_status:
          type: [string, 'null']
          enum: [STOPPED_AT, IN_TRANSIT_TO, null]
          description: |
            Whether the vehicle is at that stop or heading to it, in the
            feed's `current_status` words. Null when `stop_id` is.
        schedule_deviation_s:
          type: [integer, 'null']
          format: int64
          description: |
            How far from its trip's timetable the vehicle's latest report put
            it, in seconds: positive late, negative early. Worked out when the
            report was accepted, from the vehicle's place on the trip's shape
            against the timetable's time for that place, interpolated between
            the stops either side; at a stop it is 0 from the stop's arrival
            to its departure. The run judged is the report's `start_date`'s,
            or when it gave none, the run the trip's start is matched to, as
            on the trip page. Null when the report did not say: no GTFS trip,
            a trip in frequencies.txt or whose shape was drawn through its
            stops, off route, before the vehicle has left its first stop or
            past its last, a stop left without a time because no timed stop
            follows it, no run of the trip to judge against, more than 90
            minutes early or late against it, which puts the vehicle on
            another run, and a vehicle restored at startup until it next
            reports. The trip updates feed publishes the same figure as its
            `delay`.
        reported_at:
          type: integer
          format: int64
          description: Device timestamp of the last fix, Unix seconds.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 UTC time the tracker last recorded this vehicle.

    # Named so the drift guard has a stable address to pin against
    # defaultRiderRideListLimit / maxRiderRideListLimit in
    # rider_admin_handlers.go.
    RiderRideListLimit:
      type: integer
      minimum: 1
      maximum: 200
      default: 50

    APIKey:
      type: object
      description: |
        A feed API key. `key_hash` is deliberately absent: the Go struct tags
        it `json:"-"`, because only the hash is stored and it is never served.
      required: [id, name, active, last_used_at, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 255
        active:
          type: boolean
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: |
            Null until the key authenticates a feed request. Written at most
            once a minute, so it can trail the key's latest request by up to
            a minute.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    APIKeyList:
      type: object
      required: [count, has_more, api_keys]
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of keys in `api_keys`, after the `limit` cap is applied.
        has_more:
          type: boolean
          description: True when there are more keys than this page returned.
        api_keys:
          type: array
          items:
            $ref: '#/components/schemas/APIKey'

    APIKeyCreated:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: |
                The raw key, returned only here. Only its hash is stored, so
                it cannot be recovered afterwards.

    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    AuditLog:
      type: object
      required: [count, has_more, entries]
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of entries in `entries`, after the `limit` cap is applied.
        has_more:
          type: boolean
          description: True when more entries match than this page returned.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'

    AuditEntry:
      type: object
      description: |
        One change to one object, one sign-in or sign-out, or failed sign-ins
        to one account from one address. `before` and
        `after` hold the object's small fields, never a password, a key or a
        token: a vehicle's `label`, `agency_tag` and `active`; an account's
        `name`, `email`, `role` and `active`; an API key's `name` and `active`;
        a trip's `status`. An account's `assign_vehicle` and `unassign_vehicle`
        hold the `vehicle_id`. A session's `sign_in` and `sign_out` hold `via`
        in `after`: `admin` for the admin UI, or `api` for
        `POST /api/v1/auth/login` and `POST /api/v1/auth/logout`, which the
        driver apps use too. A `sign_in_failed`, a wrong password or the right
        one for a deactivated account, also holds `attempts`: 1 for the first,
        recorded at once, and for further ones through the same way in over the
        ten minutes after it, how many there were, recorded together when the
        ten minutes are over. Never the email or the password typed.
      required: [id, at, actor_id, actor_email, object_type, object_id, action, before, after]
      properties:
        id:
          type: integer
          format: int64
          description: Grows with each entry, so it orders them.
        at:
          type: string
          format: date-time
          description: |
            When the change, sign-in or sign-out was made, in UTC. For a
            `sign_in_failed`, when it was recorded.
        actor_id:
          type: [integer, 'null']
          format: int64
          description: |
            The user id of the admin who made the change, or of the account
            that signed in or out. Null for a change the server made itself:
            the first admin, created from `ADMIN_BOOTSTRAP_EMAIL`, or an
            account restored with `reset-admin`. Null too for a
            `sign_in_failed`, since who was at it is unknown. It is kept after
            the account is deleted.
        actor_email:
          type: string
          description: |
            That account's email, kept with the entry so it still names them
            after the account changes or is deleted. Empty for the server and
            for a `sign_in_failed`.
        actor_ip:
          type: string
          description: |
            The address the request came from, read as the sign-in rate limiter
            reads it, so behind a proxy it is right only with
            `TRUST_PROXY_HEADERS` set. Empty for the server. Left out of a
            viewer's entries.
        object_type:
          type: string
          enum: [vehicle, user, trip, api_key, session]
        object_id:
          type: string
          description: |
            The vehicle's id, or the account's, trip's or API key's number. A
            session's is its account's number: for a `sign_in_failed`, the
            account that could not be signed in to.
        action:
          type: string
          enum: [create, update, activate, deactivate, delete, set_password, assign_vehicle, unassign_vehicle, end, sign_in, sign_out, sign_in_failed]
        before:
          type: [object, 'null']
          description: |
            The fields before the change. Null for a create, an
            `assign_vehicle`, a `set_password`, a `sign_in`, a `sign_out` and a
            `sign_in_failed`.
        after:
          type: [object, 'null']
          description: The fields after the change. Null for a delete, an `unassign_vehicle` and a `set_password`.

    CatalogRoutes:
      type: object
      required: [routes]
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRoute'

    CatalogRoute:
      type: object
      required: [id, short_name, long_name, color, text_color, type]
      properties:
        id:
          type: string
        short_name:
          type: string
        long_name:
          type: string
        color:
          type: string
        text_color:
          type: string
        type:
          type: integer
          description: GTFS `route_type`.

    CatalogRouteTrips:
      type: object
      required: [route_id, service_date, timezone, trips]
      properties:
        route_id:
          type: string
        service_date:
          type: string
          pattern: '^[0-9]{8}$'
        timezone:
          type: string
          description: IANA name the schedule's times are expressed in.
        trips:
          type: array
          items:
            $ref: '#/components/schemas/CatalogTripSummary'

    CatalogTripSummary:
      type: object
      required: [id, headsign, short_name, block_id, direction_id, starts_at, ends_at, first_stop, last_stop]
      properties:
        id:
          type: string
        headsign:
          type: string
        short_name:
          type: string
          description: From trips.txt `trip_short_name`; empty when the feed gives none.
        block_id:
          type: string
          description: From trips.txt `block_id`; empty when the feed gives none.
        direction_id:
          type: [integer, 'null']
          description: Null when the schedule does not give one.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        first_stop:
          type: string
        last_stop:
          type: string

    CatalogTrip:
      type: object
      required:
        - id
        - route_id
        - headsign
        - direction_id
        - service_date
        - timezone
        - route
        - shape
        - stops
        - from_frequencies
        - thresholds
      properties:
        id:
          type: string
        route_id:
          type: string
        headsign:
          type: string
        direction_id:
          type: [integer, 'null']
        service_date:
          type: string
          pattern: '^[0-9]{8}$'
        timezone:
          type: string
        route:
          $ref: '#/components/schemas/CatalogTripRoute'
        shape:
          $ref: '#/components/schemas/CatalogShape'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/CatalogStop'
        from_frequencies:
          type: boolean
          description: |
            True when frequencies.txt runs the trip, by headway or at exact
            times. The stops' arrival_at and departure_at are then the pattern
            each run follows, placed on service_date, not the times of the run
            a vehicle is on.
        thresholds:
          $ref: '#/components/schemas/CatalogThresholds'

    CatalogTripRoute:
      type: object
      description: |
        The trip's route, flattened. All-empty when the schedule has no route
        record for it — the zero value is the intended answer rather than an
        error.
      required: [short_name, long_name, color, text_color]
      properties:
        short_name:
          type: string
        long_name:
          type: string
        color:
          type: string
        text_color:
          type: string

    CatalogShape:
      type: object
      required: [length_m, points, from_stops]
      properties:
        from_stops:
          type: boolean
          description: |
            True when the feed gives the trip no shape (`shapes.txt` is
            optional in GTFS) and this one was drawn as straight lines through
            the trip's stops. The route curves away from those lines between
            stops, so a client should not show the vehicle as off route by its
            distance from this shape. Progress along it and the schedule are
            still meaningful. Rider verification skips its on-route check for
            these trips.
        length_m:
          type: number
          format: double
        points:
          type: array
          description: Ordered `[latitude, longitude]` pairs.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
              format: double

    CatalogStop:
      type: object
      required: [id, name, sequence, lat, lon, along_shape_m, arrival_at, departure_at]
      properties:
        id:
          type: string
        name:
          type: string
        sequence:
          type: integer
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        along_shape_m:
          type: number
          format: double
          description: Distance from the start of the shape to this stop.
        arrival_at:
          type: string
          format: date-time
        departure_at:
          type: string
          format: date-time

    CatalogThresholds:
      type: object
      description: The tolerances the server applies when judging a vehicle against this trip.
      required: [max_shape_distance_m, schedule_early_s, schedule_late_s]
      properties:
        max_shape_distance_m:
          type: number
          format: double
        schedule_early_s:
          type: integer
        schedule_late_s:
          type: integer

    MapConfig:
      type: object
      required: [pmtiles_url]
      properties:
        pmtiles_url:
          type: [string, 'null']
          format: uri
          description: |
            An http or https URL of a PMTiles map file covering the agency's
            service area, or null when the agency has not configured one.

    RiderRegisterRequest:
      type: object
      additionalProperties: false
      required: [installation_id, platform]
      properties:
        installation_id:
          type: string
          format: uuid
          description: |
            Stable per-install identifier, and a UUID — anything else is
            rejected with 400. Re-registering with the same value reissues the
            token rather than creating a second rider.
        platform:
          type: string
          enum: [ios, android, other]
        app_id:
          type: string
          maxLength: 100
        app_version:
          type: string
          maxLength: 100
        attestation:
          type: 'null'
          description: |
            Reserved. No verifier is wired up yet, so the field must be null or
            omitted; any other value is rejected with
            `400 attestation not supported` rather than silently ignored,
            which would let a client believe it had attested.

    RiderRegisterResponse:
      type: object
      required: [rider_id, token, report_interval_seconds, max_batch_size]
      properties:
        rider_id:
          type: string
        token:
          type: string
          description: Rider JWT for the `riderAuth` scheme.
        report_interval_seconds:
          type: integer
          description: How often the server wants position batches.
        max_batch_size:
          type: integer
          description: Largest batch the positions endpoint will accept.

    StartRideRequest:
      type: object
      additionalProperties: false
      description: |
        Only `trip_id` is required. An absent `start_date` falls back to the
        trip's current service date, and the remaining fields are optional
        context the matcher uses when present.
      required: [trip_id]
      properties:
        trip_id:
          type: string
          minLength: 1
          maxLength: 100
        start_date:
          type: string
          pattern: '^([0-9]{8})?$'
          description: |
            GTFS service date as `YYYYMMDD`. Defaults to the trip's current
            service date when omitted or empty.
        route_id:
          type: string
          maxLength: 100
        vehicle_id:
          anyOf:
            - $ref: '#/components/schemas/VehicleID'
            - const: ''
          description: |
            A vehicle id names the same thing here as everywhere else in the
            API, so it is held to the same shape — `handleStartRide` runs the
            same `validateVehicleID` the driver endpoints use. Omit it, or
            send an empty string, when the rider's app does not know it.
        boarding_stop_id:
          type: string
          maxLength: 100
        destination_stop_id:
          type: string
          maxLength: 100

    StartRideResponse:
      type: object
      required: [ride_id, state, report_interval_seconds, max_batch_size]
      properties:
        ride_id:
          type: string
        state:
          type: string
          description: The ride's initial matching state.
        report_interval_seconds:
          type: integer
        max_batch_size:
          type: integer
        destination:
          $ref: '#/components/schemas/RideDestination'

    RideDestination:
      type: object
      description: |
        Where the rider said they are getting off, resolved to a position.
        Omitted when the destination stop could not be placed.
      required: [stop_id, latitude, longitude]
      properties:
        stop_id:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    PositionsRequest:
      type: object
      additionalProperties: false
      required: [positions]
      properties:
        positions:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/PositionUpload'

    PositionUpload:
      type: object
      additionalProperties: false
      description: |
        One fix from the device. `accuracy`, `speed`, and `bearing` may be sent
        as null or left out entirely — a device with no reading should say so
        rather than claim a zero.
      required: [latitude, longitude, timestamp]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        accuracy:
          type: [number, 'null']
          format: double
        speed:
          type: [number, 'null']
          format: double
        bearing:
          type: [number, 'null']
          format: double
        timestamp:
          type: integer
          format: int64
          description: Unix seconds.

    PositionsResponse:
      type: object
      required:
        - state
        - published
        - corroboration
        - accepted
        - ignored
        - off_route_streak
        - ended
        - end_reason
      properties:
        state:
          type: string
          description: The ride's matching state after this batch.
        published:
          type: boolean
          description: Whether the ride is now contributing to the public feed.
        corroboration:
          type: string
        accepted:
          type: integer
        ignored:
          type: integer
          description: Fixes discarded as off-route, stale, or duplicated.
        off_route_streak:
          type: integer
        ended:
          type: boolean
          description: |
            True when the server ended the ride itself, typically after a long
            off-route streak. The batch still returns 200.
        end_reason:
          type: string
          description: Empty unless `ended` is true.

    EndRideRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: |
            Why the client stopped the ride. Only these eight are accepted —
            a rider cannot claim its own ride was superseded or rejected, so
            the server-side reasons are not in this list and anything outside
            it is a 400.
          enum:
            - user_requested
            - arrived
            - stationary
            - max_duration
            - location_unavailable
            - authorization_denied
            - network_failure
            - app_terminated

    EndRideResponse:
      type: object
      required: [status, summary]
      properties:
        status:
          type: string
        summary:
          $ref: '#/components/schemas/RideSummary'

    RideSummary:
      type: object
      required: [points, matched, corroborated, duration_seconds]
      properties:
        points:
          type: integer
        matched:
          type: integer
        corroborated:
          type: integer
        duration_seconds:
          type: integer

    TripCoverage:
      type: object
      required: [trip_id, start_date, trusted, rider_reported, riders]
      properties:
        trip_id:
          type: string
        start_date:
          type: string
          pattern: '^[0-9]{8}$'
        trusted:
          type: boolean
          description: A trusted AVL feed already covers this trip.
        rider_reported:
          type: boolean
          description: At least one rider is currently positioning this trip.
        riders:
          type: integer
          description: How many riders are reporting it.

    RiderStatus:
      type: object
      description: |
        The detail sections are omitted when rider mode is off, so a disabled
        server answers `{"enabled": false}`.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        gtfs:
          $ref: '#/components/schemas/RiderGTFSStatus'
        trusted_feeds:
          type: array
          items:
            $ref: '#/components/schemas/RiderFeedStatus'
        riders:
          $ref: '#/components/schemas/RiderTierCounts'
        rides:
          $ref: '#/components/schemas/RiderRideCounts'

    RiderGTFSStatus:
      type: object
      required: [source, loaded_at, trips, shapes, timezone]
      properties:
        source:
          type: string
        loaded_at:
          type: string
          format: date-time
        trips:
          type: integer
        shapes:
          type: integer
        timezone:
          type: string

    RiderFeedStatus:
      type: object
      required: [url, last_success, last_error, entities]
      properties:
        url:
          type: string
        last_success:
          type: string
          description: RFC 3339 UTC, or an empty string if the feed has never succeeded.
        last_error:
          type: string
        entities:
          type: integer

    RiderTierCounts:
      type: object
      required: [total, trusted, blocked]
      properties:
        total:
          type: integer
        trusted:
          type: integer
        blocked:
          type: integer

    RiderRideCounts:
      type: object
      required: [active, publishable]
      properties:
        active:
          type: integer
        publishable:
          type: integer

    AdminRides:
      type: object
      required: [count, has_more, rides]
      properties:
        count:
          type: integer
        has_more:
          type: boolean
        rides:
          type: array
          items:
            $ref: '#/components/schemas/AdminRide'

    AdminRide:
      type: object
      required:
        - id
        - rider_id
        - trip_id
        - start_date
        - route_id
        - state
        - corroborated
        - status
        - end_reason
        - points_total
        - points_matched
        - points_corroborated
        - started_at
        - ended_at
      properties:
        id:
          type: string
        rider_id:
          type: string
        trip_id:
          type: string
        start_date:
          type: string
        route_id:
          type: string
        state:
          type: string
        corroborated:
          type: boolean
        status:
          type: string
          enum: [active, ended]
        end_reason:
          type: string
        points_total:
          type: integer
        points_matched:
          type: integer
        points_corroborated:
          type: integer
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
          description: Null while the ride is still active.

    # Named so the drift guard has a stable address to pin against
    # defaultListLimit / maxListLimit in handlers.go.
    ListLimit:
      type: integer
      minimum: 1
      maximum: 200
      default: 50

    # maxListOffset is math.MaxInt32: the paged queries take an int32 offset,
    # and a larger value would wrap negative and surface as a 500 rather than
    # a 400.
    ListOffset:
      type: integer
      minimum: 0
      maximum: 2147483647
      default: 0

    # Named so the drift guard has a stable address to pin against
    # defaultTripListLimit / maxTripListLimit in admin_live_handlers.go.
    TripListLimit:
      type: integer
      minimum: 1
      maximum: 200
      default: 50

    TripList:
      type: object
      required: [count, has_more, trips]
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of trips in `trips`, after the `limit` cap is applied.
        has_more:
          type: boolean
          description: True when more trips match the filter than this page returned.
        trips:
          type: array
          items:
            $ref: '#/components/schemas/TripSummary'

    MyTripList:
      type: object
      required: [count, has_more, trips]
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of trips in `trips`, after the `limit` cap is applied.
        has_more:
          type: boolean
          description: True when more trips exist past this page.
        trips:
          type: array
          items:
            $ref: '#/components/schemas/MyTrip'

    MyTrip:
      type: object
      description: |
        One of the calling driver's own trips. `route` and `headsign` come from
        the schedule as it is now, so a trip keeps them only as long as the
        schedule has its route and its trip.
      required:
        - id
        - vehicle_id
        - vehicle_label
        - route_id
        - route
        - gtfs_trip_id
        - headsign
        - start_time
        - status
      properties:
        id:
          type: integer
          format: int64
        vehicle_id:
          $ref: '#/components/schemas/VehicleID'
        vehicle_label:
          type: string
        route_id:
          type: string
          description: The route the trip was started with; empty when it was started without one.
        route:
          description: |
            The trip's route, from `route_id` or else from its GTFS trip. Null
            when it has neither, or the schedule no longer has the route.
          oneOf:
            - $ref: '#/components/schemas/CatalogTripRoute'
            - type: 'null'
        gtfs_trip_id:
          type: string
        headsign:
          type: string
          description: The GTFS trip's headsign; empty when there is none.
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          description: |
            Present only on completed trips. The server omits this field while
            the trip is active (Go `*time.Time` with `omitempty`).
        status:
          type: string
          enum: [active, completed]

    TripSummary:
      type: object
      description: |
        A trip with its vehicle label and driver name resolved. Distinct from
        `Trip`, which is what the driver-facing trip endpoints return.
      required:
        - id
        - vehicle_id
        - vehicle_label
        - user_id
        - driver_name
        - route_id
        - gtfs_trip_id
        - start_time
        - status
      properties:
        id:
          type: integer
          format: int64
        vehicle_id:
          $ref: '#/components/schemas/VehicleID'
        vehicle_label:
          type: string
        user_id:
          type: integer
          format: int64
        driver_name:
          type: string
        route_id:
          type: string
        gtfs_trip_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          description: |
            Present only on completed trips. The server omits this field while
            the trip is active (Go `*time.Time` with `omitempty`).
        status:
          type: string
          enum: [active, completed]

    AlertList:
      type: object
      required: [count, alerts]
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of alerts in `alerts`.
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'

    Alert:
      type: object
      required: [kind, since, duration_seconds, trip]
      properties:
        kind:
          type: string
          enum: [quiet, off_route, not_moving, not_started, bunched]
        since:
          type: string
          format: date-time
          description: |
            For `quiet`, the vehicle's last report (or the trip's start, or
            the server's start, when it has not reported since). For
            `off_route`, its first report off route. For `not_moving`, when it
            came within 50 m of where it is now. For `not_started`, when the
            next trip was due to leave. For `bunched`, the later of the two
            vehicles' reports when it was first found bunched; a look that
            does not find it bunched starts it again.
        duration_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Whole seconds from `since` to when the list was worked out.
        trip:
          $ref: '#/components/schemas/TripSummary'
        next_trip:
          $ref: '#/components/schemas/AlertNextTrip'
        ahead:
          $ref: '#/components/schemas/AlertAhead'

    AlertNextTrip:
      type: object
      description: |
        The scheduled trip a `not_started` alert is about: the next one on the
        block after the trip in `trip`. Only `not_started` alerts have one.
      required: [gtfs_trip_id, route_id, block_id]
      properties:
        gtfs_trip_id:
          type: string
        route_id:
          type: string
        block_id:
          type: string

    AlertAhead:
      type: object
      description: |
        The vehicle a `bunched` alert's vehicle is running behind, as of their
        latest reports. Only `bunched` alerts have one.
      required: [vehicle_id, vehicle_label, spacing_s, scheduled_gap_s]
      properties:
        vehicle_id:
          $ref: '#/components/schemas/VehicleID'
        vehicle_label:
          type: string
        spacing_s:
          type: integer
          minimum: 0
          description: |
            How far behind the vehicle ahead the alert's vehicle is running,
            in whole seconds, 0 when level with it.
        scheduled_gap_s:
          type: integer
          minimum: 1
          description: |
            The scheduled gap at the stop the alert's vehicle is at or heading
            to, in whole seconds: the `every N min` the spacing is judged
            against.

    ServiceReport:
      type: object
      required: [date, timezone, on_time_early_s, on_time_late_s, routes]
      properties:
        date:
          type: string
          format: date
          description: The service day reported on.
        timezone:
          type: string
          description: The agency timezone the schedule's times are in, such as `Africa/Nairobi`.
        on_time_early_s:
          type: integer
          minimum: 0
          description: How early, in seconds, a stop may be passed and still be on time.
        on_time_late_s:
          type: integer
          minimum: 0
          description: How late, in seconds, a stop may be passed and still be on time.
        routes:
          type: array
          description: |
            Each route with at least one trip scheduled that day, in the
            catalog's display order. Empty when nothing is scheduled.
          items:
            $ref: '#/components/schemas/RouteServiceReport'

    RouteServiceReport:
      type: object
      required:
        - route_id
        - short_name
        - long_name
        - trips_scheduled
        - trips_run
        - stops_on_time
        - stops_early
        - stops_late
        - stops_unknown
        - on_time_percent
        - unknown_percent
        - trips
        - gaps
      properties:
        route_id:
          type: string
        short_name:
          type: string
        long_name:
          type: string
        trips_scheduled:
          type: integer
          minimum: 0
          description: |
            Scheduled trips, counting a trip in frequencies.txt once for each
            run its windows schedule.
        trips_run:
          type: integer
          minimum: 0
          description: |
            Scheduled trips a driver ran at least once, counting a trip in
            frequencies.txt once for each of its runs a driver ran.
        stops_on_time:
          type: integer
          minimum: 0
          description: Judged stops of the trips run that were passed on time; the four stop counts add up to every judged stop.
        stops_early:
          type: integer
          minimum: 0
        stops_late:
          type: integer
          minimum: 0
        stops_unknown:
          type: integer
          minimum: 0
          description: Judged stops with no fix within 2 minutes either side of the vehicle passing them.
        on_time_percent:
          type: [number, 'null']
          description: |
            `stops_on_time` as a percentage of the stops with a known time, to
            one decimal place. Null when no stop time is known.
        unknown_percent:
          type: [number, 'null']
          description: |
            `stops_unknown` as a percentage of every judged stop, to one decimal
            place. Null when no trip ran.
        trips:
          type: array
          description: Every scheduled trip of the route that day, by first departure.
          items:
            $ref: '#/components/schemas/ScheduledTripReport'
        gaps:
          type: array
          description: |
            The gaps between vehicles on the route's frequent service, one
            entry for each direction that day with a trip in frequencies.txt
            or a timetable every 12 minutes or more often at a stop measured,
            by `direction_id` and then headsign, whether anything ran or not.
            Empty for a route with neither.
          items:
            $ref: '#/components/schemas/ServiceReportGaps'

    ServiceReportGaps:
      type: object
      required:
        - direction_id
        - headsign
        - gaps_judged
        - bunched
        - long_gaps
        - unknown
        - extra_wait_s
        - scheduled_gap_s
      properties:
        direction_id:
          type: [integer, 'null']
          description: The trips' `direction_id`, null when the feed gives none.
        headsign:
          type: string
          description: |
            The headsign of the direction's first trip of the day. Where
            `direction_id` is null it is what tells the directions apart.
        gaps_judged:
          type: integer
          minimum: 0
          description: Gaps judged against the scheduled gap, at every stop measured.
        bunched:
          type: integer
          minimum: 0
          description: Gaps judged that were under 25% of the scheduled gap.
        long_gaps:
          type: integer
          minimum: 0
          description: Gaps judged that were over 150% of the scheduled gap.
        unknown:
          type: integer
          minimum: 0
          description: |
            Gaps between two known passings that a run whose passing was not
            known could have fallen in, so not judged.
        extra_wait_s:
          type: [integer, 'null']
          description: |
            Excess Wait Time as TfL defines it, in seconds: the average wait
            of a rider who turned up at random, sum(h^2) / 2 sum(h) over the
            gaps judged, less the same over their scheduled gaps. Below zero
            when the vehicles came more often than scheduled. A vehicle
            without the app reads as a gap, so it is high when some runs were
            not reported. Null when no gap was judged.
        scheduled_gap_s:
          type: [integer, 'null']
          description: |
            The scheduled gap, in seconds, of the most gaps judged, the
            shortest of those as common, such as 600 for every 10 minutes.
            Null when no gap was judged.

    ScheduledTripReport:
      type: object
      required:
        - gtfs_trip_id
        - headsign
        - scheduled_departure
        - scheduled_arrival
        - runs
        - departure_deviation_s
        - arrival_deviation_s
        - stops_on_time
        - stops_early
        - stops_late
        - stops_unknown
        - on_time_percent
        - unknown_percent
        - frequencies
      properties:
        gtfs_trip_id:
          type: string
        headsign:
          type: string
        scheduled_departure:
          type: string
          format: date-time
          description: |
            Departure from the first stop, with the agency's UTC offset. For a
            trip in frequencies.txt, its first run's.
        scheduled_arrival:
          type: string
          format: date-time
          description: |
            Arrival at the last stop, with the agency's UTC offset. For a trip
            in frequencies.txt, its last run's.
        runs:
          type: array
          description: The driver trips that ran it. Empty when it was not run.
          items:
            $ref: '#/components/schemas/ServiceReportRun'
        departure_deviation_s:
          type: [integer, 'null']
          description: Seconds from the scheduled departure from the first stop, late positive. Null when not run or unknown.
        arrival_deviation_s:
          type: [integer, 'null']
          description: Seconds from the scheduled arrival at the last stop, late positive. Null when not run or unknown.
        stops_on_time:
          type: integer
          minimum: 0
        stops_early:
          type: integer
          minimum: 0
        stops_late:
          type: integer
          minimum: 0
        stops_unknown:
          type: integer
          minimum: 0
        on_time_percent:
          type: [number, 'null']
        unknown_percent:
          type: [number, 'null']
        frequencies:
          description: |
            How a trip in frequencies.txt runs and how many of its runs ran.
            Null for a trip run by timetable. Such a trip's stops are not
            judged, so its deviations and percentages are null and its stop
            counts zero.
          anyOf:
            - $ref: '#/components/schemas/ServiceReportFrequencies'
            - type: 'null'

    ServiceReportFrequencies:
      type: object
      required: [windows, runs_scheduled, runs_run]
      properties:
        windows:
          type: array
          description: The trip's frequencies.txt rows, by start.
          items:
            $ref: '#/components/schemas/ServiceReportFrequencyWindow'
        runs_scheduled:
          type: integer
          minimum: 0
          description: |
            The runs the windows schedule: one every headway from each
            window's start up to but not including its end.
        runs_run:
          type: integer
          minimum: 0
          description: The scheduled runs a driver's trip filled, never more than `runs_scheduled`.

    ServiceReportFrequencyWindow:
      type: object
      required: [start, end, headway_s, exact_times]
      properties:
        start:
          type: string
          format: date-time
          description: The window's start_time on the service day, with the agency's UTC offset.
        end:
          type: string
          format: date-time
          description: The window's end_time, when no run is due any more.
        headway_s:
          type: integer
          description: Seconds between runs, headway_secs.
        exact_times:
          type: boolean
          description: True when the runs leave at exactly those times (exact_times=1), false when they run by headway.

    ServiceReportRun:
      type: object
      required: [id, vehicle_id, vehicle_label, driver_name]
      properties:
        id:
          type: integer
          format: int64
          description: The trip's id, as in `GET /api/v1/admin/trips/{id}`.
        vehicle_id:
          $ref: '#/components/schemas/VehicleID'
        vehicle_label:
          type: string
        driver_name:
          type: string

    FeedHealth:
      type: object
      required: [since, last_hour, total, minutes, hours]
      properties:
        since:
          type: string
          format: date-time
          description: When counting started, which is when the server started.
        last_hour:
          $ref: '#/components/schemas/FeedHealthPeriod'
        total:
          $ref: '#/components/schemas/FeedHealthPeriod'
        minutes:
          type: array
          description: |
            The last 60 minutes, oldest first, ending with the minute in
            progress. Every minute is listed, with zeros where nothing came
            in. `last_hour` is their sum.
          items:
            $ref: '#/components/schemas/FeedHealthMinute'
        hours:
          type: array
          description: |
            The last 24 hours, or with `days=7` the last 168, oldest first,
            ending with the hour in progress. Every hour is listed, with zeros
            where nothing came in or the server was not running. Hours start
            on the hour, in UTC. Empty when the saved hours could not be read,
            and `hours_error` says so; the minutes and the total are still
            given.
          items:
            $ref: '#/components/schemas/FeedHealthHour'
        hours_error:
          type: string
          description: |
            Present only when the saved hours could not be read from the
            database.

    FeedHealthHour:
      type: object
      required: [hour, reports, feed, vehicles]
      properties:
        hour:
          type: string
          format: date-time
          description: The start of the hour, in UTC.
        reports:
          $ref: '#/components/schemas/ReportOutcomes'
        feed:
          $ref: '#/components/schemas/FeedOutcomes'
        vehicles:
          type: integer
          minimum: 0
          description: |
            How many vehicles had a live report accepted in the hour, each
            counted once. Across a restart within the hour, a vehicle seen by
            both servers may be counted once by each; the larger count is
            given, so the figure can be low but is never doubled.

    FeedHealthPeriod:
      type: object
      required: [reports, feed]
      properties:
        reports:
          $ref: '#/components/schemas/ReportOutcomes'
        feed:
          $ref: '#/components/schemas/FeedOutcomes'

    FeedHealthMinute:
      type: object
      required: [minute, reports, feed, vehicles]
      properties:
        minute:
          type: string
          format: date-time
          description: The start of the minute, in UTC.
        reports:
          $ref: '#/components/schemas/ReportOutcomes'
        feed:
          $ref: '#/components/schemas/FeedOutcomes'
        vehicles:
          type: integer
          minimum: 0
          description: |
            How many vehicles had a live report accepted in the minute, each
            counted once however many it sent. A batch of offline history does
            not count. Minutes do not add up to an hour's `vehicles`: vehicles
            counted in different minutes may be the same ones.

    ReportOutcomes:
      type: object
      required: [accepted, invalid, unauthorized, rate_limited, server_error]
      properties:
        accepted:
          type: integer
          format: int64
          minimum: 0
        invalid:
          type: integer
          format: int64
          minimum: 0
          description: 400, 409, 415 and any other 4xx not listed here.
        unauthorized:
          type: integer
          format: int64
          minimum: 0
          description: 401 or 403.
        rate_limited:
          type: integer
          format: int64
          minimum: 0
          description: 429.
        server_error:
          type: integer
          format: int64
          minimum: 0
          description: 5xx.

    FeedOutcomes:
      type: object
      required: [served, refused, invalid, server_error]
      properties:
        served:
          type: integer
          format: int64
          minimum: 0
        refused:
          type: integer
          format: int64
          minimum: 0
          description: 401 or 403. With `FEED_AUTH_ENABLED`, a missing, unknown or inactive API key.
        invalid:
          type: integer
          format: int64
          minimum: 0
          description: Any other 4xx, such as an unknown `source`.
        server_error:
          type: integer
          format: int64
          minimum: 0
          description: 5xx.

    TripTrail:
      type: object
      required: [trip, points]
      properties:
        trip:
          $ref: '#/components/schemas/TripSummary'
        points:
          type: array
          items:
            $ref: '#/components/schemas/TripTrailPoint'

    TripTrailPoint:
      type: object
      description: |
        `bearing`, `speed`, and `accuracy` are required and nullable for the
        same reason as elsewhere: the Go fields are pointers without
        `omitempty`, so an absent reading is `null` rather than missing.
      required:
        - latitude
        - longitude
        - bearing
        - speed
        - accuracy
        - reported_at
        - received_at
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        bearing:
          type: [number, 'null']
          format: double
        speed:
          type: [number, 'null']
          format: double
        accuracy:
          type: [number, 'null']
          format: double
        reported_at:
          type: integer
          format: int64
          description: Device timestamp, Unix seconds.
        received_at:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp of when the server stored the fix.

    # Named so the drift guard has a stable address to pin against
    # defaultHistoryLimit / maxHistoryLimit in location_history_handlers.go.
    HistoryLimit:
      type: integer
      minimum: 1
      maximum: 1000
      default: 100

    LocationHistory:
      type: object
      required: [vehicle_id, count, has_more, locations]
      properties:
        vehicle_id:
          $ref: '#/components/schemas/VehicleID'
        count:
          type: integer
          minimum: 0
          description: Number of fixes in `locations`, after the `limit` cap is applied.
        has_more:
          type: boolean
          description: |
            True when more fixes exist in the window than `limit` allowed.
            Narrow the window or raise `limit` to see them.
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationHistoryEntry'

    LocationHistoryEntry:
      type: object
      required:
        - latitude
        - longitude
        - bearing
        - speed
        - accuracy
        - timestamp
        - trip_id
        - received_at
      description: |
        `bearing`, `speed`, and `accuracy` carry no `omitempty`, so they are
        always present and are explicitly `null` when the device did not
        report them. That distinguishes "unknown" from a real zero — a
        bearing of 0 is due north, not a missing value.
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        bearing:
          type: [number, 'null']
          format: double
        speed:
          type: [number, 'null']
          format: double
        accuracy:
          type: [number, 'null']
          format: double
        timestamp:
          type: integer
          format: int64
          description: Unix seconds, as reported by the device.
        trip_id:
          type: string
          description: Empty string when the fix was not associated with a trip.
        received_at:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp of when the server stored the fix.

    CreateAssignmentRequest:
      type: object
      additionalProperties: false
      required: [user_id, vehicle_id]
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
        vehicle_id:
          $ref: '#/components/schemas/VehicleID'

    Assignment:
      type: object
      required: [user_id, vehicle_id, created_at]
      properties:
        user_id:
          type: integer
          format: int64
        vehicle_id:
          $ref: '#/components/schemas/VehicleID'
        created_at:
          type: string
          format: date-time

    StartTripRequest:
      type: object
      additionalProperties: false
      required: [vehicle_id]
      properties:
        vehicle_id:
          $ref: '#/components/schemas/VehicleID'
        route_id:
          type: string
          maxLength: 100
        gtfs_trip_id:
          type: string
          maxLength: 100

    EndTripRequest:
      type: object
      additionalProperties: false
      required: [trip_id]
      properties:
        trip_id:
          type: integer
          format: int64
          minimum: 1

    Trip:
      type: object
      required:
        - id
        - user_id
        - vehicle_id
        - route_id
        - gtfs_trip_id
        - start_time
        - status
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        vehicle_id:
          $ref: '#/components/schemas/VehicleID'
        route_id:
          type: string
        gtfs_trip_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          description: |
            Present only on completed trips. The server omits this field
            while the trip is active (Go `*time.Time` with `omitempty`).
        status:
          type: string
          enum: [active, completed]

    AdminStatus:
      type: object
      required:
        - status
        - uptime_seconds
        - active_vehicles
        - total_vehicles_tracked
      properties:
        status:
          type: string
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        active_vehicles:
          type: integer
          minimum: 0
        total_vehicles_tracked:
          type: integer
          minimum: 0
        last_update:
          type: string
          format: date-time
          description: |
            Timestamp of the most recent location report. Omitted when no
            vehicle has reported yet (Go `*time.Time` with `omitempty`).
