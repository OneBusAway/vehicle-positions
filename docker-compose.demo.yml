# The demo stack: the server on a sample agency's GTFS schedule, with simulated
# vehicles driving its routes. Start it with `make demo`, which generates the
# two secrets below; docs/demo.md walks through it.
name: vehicle-positions-demo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vehicle_positions
    # No `ports:` on purpose. Only the server reaches the database, over the
    # compose network, so the demo does not need port 5432 on your machine.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  server:
    build: .
    # Bound to loopback: this is a demo with a throwaway admin account, not
    # something to reach from another machine.
    ports:
      - "127.0.0.1:${DEMO_PORT:-18080}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/vehicle_positions?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set; start the demo with `make demo`}"
      GTFS_STATIC_URL: "/demo/gtfs.zip"
      ADMIN_BOOTSTRAP_EMAIL: "admin@demo.example"
      ADMIN_BOOTSTRAP_PASSWORD: "${DEMO_ADMIN_PASSWORD:?DEMO_ADMIN_PASSWORD is not set; start the demo with `make demo`}"
    volumes:
      - ./demo/gtfs.zip:/demo/gtfs.zip:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: demo/simulator.Dockerfile
    # The simulator only sends its login over plain HTTP to localhost, so it
    # shares the server's network namespace instead of calling it by name.
    network_mode: "service:server"
    environment:
      ADMIN_BOOTSTRAP_EMAIL: "admin@demo.example"
      ADMIN_BOOTSTRAP_PASSWORD: "${DEMO_ADMIN_PASSWORD:?DEMO_ADMIN_PASSWORD is not set; start the demo with `make demo`}"
    # Nine vehicles, three on each of the feed's routes. Each reports every 6 s
    # (the server allows a driver one report per 5 s) until the stack stops.
    command: ["-url", "http://localhost:8080", "-vehicles", "9", "-interval", "6s", "-duration", "0"]
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
